<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ledgerly Categories</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <header class="topbar">

    <div>
        <h2>Ledgerly</h2>
    </div>

    <nav class="topbar-actions">

        <a href="dashboard.html" class="nav-link">
            Dashboard
        </a>

        <a href="transactions.html" class="nav-link">
            Transactions
        </a>

        <a href="categories.html" class="nav-link active">
            Categories
        </a>

        <a href="reports.html" class="nav-link">
            Reports
        </a>

        <span id="userName">User</span>

        <button id="logoutButton">
            Logout
        </button>

    </nav>

</header>


    <main class="dashboard-container">

        <section class="welcome-section">

            <h1>Categories</h1>

            <p>
                Manage your income and expense categories.
            </p>

        </section>


        <section class="categories-grid">

            <div class="category-panel">

                <div class="section-header">

                    <div>
                        <h2>Income Categories</h2>
                        <p>Categories used for money coming in.</p>
                    </div>

                </div>

                <div id="incomeCategories">
                    Loading...
                </div>

            </div>


            <div class="category-panel">

                <div class="section-header">

                    <div>
                        <h2>Expense Categories</h2>
                        <p>Categories used for money going out.</p>
                    </div>

                </div>

                <div id="expenseCategories">
                    Loading...
                </div>

            </div>

        </section>


        <section class="add-category-section">

            <h2>Add Category</h2>

            <form id="categoryForm">

                <input
                    type="text"
                    id="categoryName"
                    placeholder="Category name"
                    required
                >

                <select id="categoryType" required>
                    <option value="">Select type</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <button type="submit">
                    + Add Category
                </button>

            </form>

            <p id="categoryMessage"></p>

        </section>

    </main>

    <div id="editCategoryModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Edit Category</h2>

            <button id="closeCategoryModalButton">
                ×
            </button>
        </div>

        <form id="editCategoryForm">

            <input type="hidden" id="editCategoryId">

            <label for="editCategoryName">Category Name</label>

            <input
                type="text"
                id="editCategoryName"
                required
            >

            <label for="editCategoryType">Type</label>

            <select id="editCategoryType" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

            <p id="editCategoryMessage"></p>

            <button
                type="submit"
                class="save-transaction-button"
            >
                Save Changes
            </button>

        </form>

    </div>

</div>


    <script src="js/categories.js"></script>

</body>
</html>
