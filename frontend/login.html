<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ledgerly Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-layout">

    <section class="auth-panel">

        <div class="auth-brand">
            <div class="brand-icon">L</div>
            <span>Ledgerly</span>
        </div>

        <div class="auth-card auth-card-modern">

            <h1>Welcome Back 👋</h1>

            <p class="auth-subtitle">
                Sign in to continue to your Ledgerly account.
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="auth-primary-button">
                    Sign In
                </button>

            </form>

            <p id="message" class="auth-message"></p>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">
                    Sign up
                </a>
            </p>

        </div>

    </section>


    <section class="auth-visual">

        <div class="auth-visual-content">

            <div class="store-illustration">
                <div class="store-roof"></div>

                <div class="store-building">
                    <div class="store-window"></div>
                    <div class="store-door"></div>
                </div>

                <div class="plant plant-left"></div>
                <div class="plant plant-right"></div>
            </div>

            <h2>
                Simple Accounting for Small Businesses
            </h2>

            <p>
                Track income, expenses, cash flow and business performance in one place.
            </p>

        </div>

    </section>

</div>


<script src="js/auth.js"></script>

</body>
</html>
