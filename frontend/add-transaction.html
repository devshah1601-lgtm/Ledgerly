<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ledgerly Add Transaction</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-body">

<div class="app-shell">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <div class="brand-icon">L</div>
            <span>Ledgerly</span>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="sidebar-link">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="transactions.html" class="sidebar-link">
                <span>▤</span>
                Transactions
            </a>

            <a href="add-transaction.html" class="sidebar-link active">
                <span>＋</span>
                Add Transaction
            </a>

            <a href="cashbook.html" class="sidebar-link">
                <span>▣</span>
                Cashbook
            </a>

            <a href="categories.html" class="sidebar-link">
                <span>▦</span>
                Categories
            </a>

            <a href="reports.html" class="sidebar-link">
                <span>◫</span>
                Reports
            </a>

        </nav>

        <div class="sidebar-footer">
            <button id="logoutButton" class="logout-link">
                <span>↪</span>
                Logout
            </button>
        </div>

    </aside>


    <main class="main-content">

        <header class="app-header">

            <div>
                <h1>Add Transaction</h1>
                <p>Record a new income or expense for your business.</p>
            </div>

            <div class="header-user">

                <div class="business-info">
                    <span class="business-label">
                        Current Business
                    </span>

                    <strong>Dev's Store</strong>
                </div>

                <div class="user-avatar">
                    <span id="userInitial">U</span>
                </div>

                <span id="userName" class="hidden-user-name">
                    User
                </span>

            </div>

        </header>


        <section class="add-transaction-layout">

            <div class="add-transaction-card">

                <div class="transaction-tabs">

                    <button
                        type="button"
                        id="incomeTab"
                        class="transaction-tab active"
                        data-type="income"
                    >
                        Income
                    </button>

                    <button
                        type="button"
                        id="expenseTab"
                        class="transaction-tab"
                        data-type="expense"
                    >
                        Expense
                    </button>

                </div>


                <form id="addTransactionForm">

                    <input
                        type="hidden"
                        id="transactionType"
                        value="income"
                    >


                    <label for="transactionCategory">
                        Category
                    </label>

                    <select id="transactionCategory" required>
                        <option value="">
                            Select category
                        </option>
                    </select>


                    <label for="transactionAmount">
                        Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="transactionAmount"
                        min="0.01"
                        step="0.01"
                        placeholder="Enter amount"
                        required
                    >


                    <label for="transactionDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="transactionDate"
                        required
                    >


                    <label for="transactionDescription">
                        Description
                    </label>

                    <textarea
                        id="transactionDescription"
                        rows="4"
                        placeholder="Enter description"
                        required
                    ></textarea>


                    <p id="transactionMessage"></p>


                    <div class="transaction-form-actions">

                        <a
                            href="transactions.html"
                            class="cancel-transaction-button"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="save-transaction-button"
                        >
                            Save Transaction
                        </button>

                    </div>

                </form>

            </div>


            <aside class="recent-categories-card">

                <h2>Recent Categories</h2>

                <p>
                    Quickly see available categories.
                </p>

                <div id="recentCategories">
                    Loading categories...
                </div>

            </aside>

        </section>

    </main>

</div>


<script src="js/add-transaction.js"></script>

</body>
</html>
